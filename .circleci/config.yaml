version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run test suite
          command: npm test

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Trigger Railway Deploy Hook
          command: curl -X POST "$RAILWAY_DEPLOY_HOOK"

workflows:
  version: 2
  build-test-deploy:
    jobs:
      - test
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
